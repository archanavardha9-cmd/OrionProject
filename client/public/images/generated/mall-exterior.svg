<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="30%" stop-color="#2d1b4e"/>
      <stop offset="60%" stop-color="#e8a065"/>
      <stop offset="80%" stop-color="#f4c98a"/>
      <stop offset="100%" stop-color="#fde8c8"/>
    </linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4c5a9"/>
      <stop offset="100%" stop-color="#a8956e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a7a8c"/>
      <stop offset="50%" stop-color="#6ba5b5"/>
      <stop offset="100%" stop-color="#89c4d4"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a7a5f"/>
      <stop offset="100%" stop-color="#6b5d45"/>
    </linearGradient>
    <radialGradient id="sun" cx="75%" cy="55%" r="20%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="40%" stop-color="#f5c96b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e8a065" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1440" cy="540" r="280" fill="url(#sun)"/>
  <!-- Ground -->
  <rect x="0" y="680" width="1920" height="400" fill="url(#ground)"/>
  <rect x="0" y="680" width="1920" height="3" fill="#a8956e" opacity="0.5"/>
  <!-- Main Building -->
  <rect x="360" y="280" width="1200" height="400" rx="4" fill="url(#building)"/>
  <!-- Glass facade -->
  <rect x="380" y="300" width="1160" height="350" rx="2" fill="url(#glass)" opacity="0.7"/>
  <!-- Window grid -->
  <g opacity="0.35" stroke="#fff" stroke-width="1">
    <line x1="570" y1="300" x2="570" y2="650"/>
    <line x1="760" y1="300" x2="760" y2="650"/>
    <line x1="960" y1="300" x2="960" y2="650"/>
    <line x1="1160" y1="300" x2="1160" y2="650"/>
    <line x1="1350" y1="300" x2="1350" y2="650"/>
    <line x1="380" y1="420" x2="1540" y2="420"/>
    <line x1="380" y1="540" x2="1540" y2="540"/>
  </g>
  <!-- Entrance canopy -->
  <rect x="780" y="580" width="360" height="100" rx="3" fill="#c4b48e"/>
  <rect x="800" y="600" width="320" height="60" rx="2" fill="url(#glass)" opacity="0.5"/>
  <!-- Entrance doors -->
  <rect x="880" y="600" width="70" height="80" rx="1" fill="#4a7a8c" opacity="0.8"/>
  <rect x="970" y="600" width="70" height="80" rx="1" fill="#4a7a8c" opacity="0.8"/>
  <!-- Side wings -->
  <rect x="160" y="380" width="200" height="300" rx="3" fill="#bfae8e"/>
  <rect x="1560" y="380" width="200" height="300" rx="3" fill="#bfae8e"/>
  <!-- Roof accent -->
  <rect x="360" y="275" width="1200" height="8" rx="2" fill="#c8a96a"/>
  <!-- Window lights -->
  <g filter="url(#glow)" opacity="0.6">
    <rect x="410" y="330" width="130" height="60" rx="2" fill="#fff8e1"/>
    <rect x="600" y="330" width="130" height="60" rx="2" fill="#fff8e1"/>
    <rect x="790" y="330" width="130" height="60" rx="2" fill="#fff8e1"/>
    <rect x="980" y="330" width="130" height="60" rx="2" fill="#fff8e1"/>
    <rect x="1170" y="330" width="130" height="60" rx="2" fill="#fff8e1"/>
    <rect x="1360" y="330" width="130" height="60" rx="2" fill="#fff8e1"/>
  </g>
  <!-- Landscaping -->
  <ellipse cx="320" cy="670" rx="60" ry="80" fill="#3d6b48"/>
  <ellipse cx="320" cy="660" rx="50" ry="65" fill="#4a7a53"/>
  <rect x="315" y="670" width="10" height="30" fill="#5a4a35"/>
  <ellipse cx="1600" cy="670" rx="55" ry="75" fill="#3d6b48"/>
  <ellipse cx="1600" cy="660" rx="45" ry="60" fill="#4a7a53"/>
  <rect x="1595" y="670" width="10" height="30" fill="#5a4a35"/>
  <!-- Parking area hint -->
  <rect x="50" y="700" width="250" height="100" rx="3" fill="#7a6b50" opacity="0.6"/>
  <rect x="1620" y="700" width="250" height="100" rx="3" fill="#7a6b50" opacity="0.6"/>
  <!-- Signage -->
  <rect x="810" y="290" width="300" height="35" rx="3" fill="#292a26"/>
  <text x="960" y="314" font-family="Georgia,serif" font-size="18" fill="#fff8e1" text-anchor="middle" letter-spacing="6">ORION MALL</text>
  <!-- Stars -->
  <g fill="#fff" opacity="0.5">
    <circle cx="200" cy="80" r="1.5"/>
    <circle cx="500" cy="120" r="1"/>
    <circle cx="800" cy="60" r="1.5"/>
    <circle cx="1100" cy="100" r="1"/>
    <circle cx="1400" cy="40" r="1.5"/>
    <circle cx="1700" cy="90" r="1"/>
    <circle cx="300" cy="180" r="1"/>
    <circle cx="1200" cy="160" r="1"/>
  </g>
  <!-- Light reflections on ground -->
  <ellipse cx="960" cy="720" rx="200" ry="20" fill="#f5c96b" opacity="0.15"/>
</svg>
