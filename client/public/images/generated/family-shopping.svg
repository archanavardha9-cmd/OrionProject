<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f0e0"/>
      <stop offset="100%" stop-color="#e8dcc0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <!-- Mall corridor -->
  <polygon points="0,0 600,200 600,800 0,1080" fill="#e0d4b8"/>
  <polygon points="1920,0 1320,200 1320,800 1920,1080" fill="#e0d4b8"/>
  <!-- Floor -->
  <polygon points="600,800 1320,800 1920,1080 0,1080" fill="#d4c4a0"/>
  <!-- Ceiling -->
  <polygon points="600,200 1320,200 1920,0 0,0" fill="#ede4d0"/>
  <!-- Center view -->
  <rect x="600" y="200" width="720" height="600" fill="#f0e8d4"/>
  <!-- Storefronts -->
  <g opacity="0.6">
    <rect x="100" y="300" width="450" height="400" rx="4" fill="#5a8a7c" opacity="0.4"/>
    <rect x="1370" y="300" width="450" height="400" rx="4" fill="#8a6a5a" opacity="0.4"/>
  </g>
  <!-- Floor tiles -->
  <g stroke="#c0b090" stroke-width="0.5" opacity="0.3">
    <line x1="960" y1="800" x2="960" y2="1080"/>
    <line x1="780" y1="800" x2="600" y2="1080"/>
    <line x1="1140" y1="800" x2="1320" y2="1080"/>
  </g>
  <!-- People (family silhouettes) -->
  <!-- Adult 1 -->
  <g transform="translate(860, 500)">
    <ellipse cx="0" cy="0" rx="22" ry="25" fill="#8a7060"/>
    <rect x="-18" y="25" width="36" height="80" rx="4" fill="#4a3a5a"/>
    <rect x="-18" y="105" width="15" height="60" rx="2" fill="#3a2a4a"/>
    <rect x="3" y="105" width="15" height="60" rx="2" fill="#3a2a4a"/>
  </g>
  <!-- Adult 2 -->
  <g transform="translate(940, 510)">
    <ellipse cx="0" cy="0" rx="20" ry="23" fill="#9a8070"/>
    <rect x="-16" y="23" width="32" height="75" rx="4" fill="#c87890"/>
    <rect x="-16" y="98" width="13" height="55" rx="2" fill="#3a3a4a"/>
    <rect x="3" y="98" width="13" height="55" rx="2" fill="#3a3a4a"/>
  </g>
  <!-- Child -->
  <g transform="translate(1010, 555)">
    <ellipse cx="0" cy="0" rx="14" ry="16" fill="#a88a70"/>
    <rect x="-11" y="16" width="22" height="45" rx="3" fill="#5a9a8a"/>
    <rect x="-11" y="61" width="9" height="35" rx="2" fill="#3a3a4a"/>
    <rect x="2" y="61" width="9" height="35" rx="2" fill="#3a3a4a"/>
  </g>
  <!-- Shopping bags -->
  <rect x="900" y="560" width="20" height="30" rx="2" fill="#c8a96a"/>
  <rect x="825" y="555" width="18" height="28" rx="2" fill="#8a2040"/>
  <!-- Ceiling lights -->
  <g fill="#fff8e0" opacity="0.3">
    <circle cx="760" cy="220" r="30"/>
    <circle cx="960" cy="210" r="35"/>
    <circle cx="1160" cy="220" r="30"/>
  </g>
  <!-- Warm ambient -->
  <rect width="1920" height="1080" fill="#fff8e0" opacity="0.05"/>
</svg>
