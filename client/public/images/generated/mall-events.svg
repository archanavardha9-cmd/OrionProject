      <circle cx="1000" cy="170" r="5"/>
      <circle cx="1120" cy="160" r="5"/>
      <circle cx="1230" cy="175" r="5"/>
      <circle cx="1340" cy="185" r="5"/>
      <circle cx="1450" cy="170" r="5"/>
      <circle cx="1560" cy="160" r="5"/>
