<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f0e0"/>
      <stop offset="100%" stop-color="#e8d8b8"/>
    </linearGradient>
    <radialGradient id="warm-light" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e8d8b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diya" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8a040"/>
      <stop offset="100%" stop-color="#c87020"/>
