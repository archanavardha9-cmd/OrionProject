<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5efe3"/>
      <stop offset="100%" stop-color="#e8dcc4"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a96a"/>
      <stop offset="100%" stop-color="#a88a4a"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <!-- Back wall -->
  <rect x="100" y="100" width="1720" height="700" fill="#e0d4b8" rx="6"/>
  <!-- Shelving units -->
  <g fill="#d4c4a0">
    <rect x="140" y="160" width="400" height="600" rx="4"/>
    <rect x="580" y="160" width="400" height="600" rx="4"/>
    <rect x="1020" y="160" width="400" height="600" rx="4"/>
    <rect x="1460" y="160" width="320" height="600" rx="4"/>
  </g>
  <!-- Clothing items (abstract) -->
  <g opacity="0.7">
    <rect x="180" y="200" width="60" height="150" rx="3" fill="#8b4a6b"/>
    <rect x="260" y="220" width="55" height="140" rx="3" fill="#4a6b8b"/>
    <rect x="340" y="210" width="60" height="145" rx="3" fill="#6b8b4a"/>
    <rect x="420" y="200" width="55" height="155" rx="3" fill="#8b6b4a"/>
    <rect x="180" y="400" width="60" height="140" rx="3" fill="#c8785d"/>
    <rect x="260" y="410" width="55" height="130" rx="3" fill="#5d78c8"/>
    <rect x="340" y="395" width="60" height="145" rx="3" fill="#78c85d"/>
    <rect x="420" y="405" width="55" height="135" rx="3" fill="#c85d78"/>
    <rect x="620" y="200" width="60" height="150" rx="3" fill="#a86060"/>
    <rect x="700" y="215" width="55" height="140" rx="3" fill="#6060a8"/>
    <rect x="780" y="205" width="60" height="148" rx="3" fill="#60a860"/>
    <rect x="860" y="195" width="55" height="155" rx="3" fill="#a8a860"/>
    <rect x="620" y="400" width="60" height="140" rx="3" fill="#d4956e"/>
    <rect x="700" y="395" width="55" height="145" rx="3" fill="#6e95d4"/>
    <rect x="780" y="410" width="60" height="130" rx="3" fill="#95d46e"/>
    <rect x="860" y="400" width="55" height="140" rx="3" fill="#d46e95"/>
  </g>
  <!-- Mannequins -->
  <g>
    <ellipse cx="1120" cy="280" rx="25" ry="28" fill="#d8c8a8"/>
    <rect x="1095" y="308" width="50" height="120" rx="3" fill="#7a3a5a"/>
    <rect x="1085" y="428" width="30" height="180" rx="2" fill="#4a3a5a"/>
    <rect x="1125" y="428" width="30" height="180" rx="2" fill="#4a3a5a"/>
    <ellipse cx="1280" cy="280" rx="25" ry="28" fill="#d8c8a8"/>
    <rect x="1255" y="308" width="50" height="120" rx="3" fill="#3a5a7a"/>
    <rect x="1245" y="428" width="30" height="180" rx="2" fill="#2a3a5a"/>
    <rect x="1285" y="428" width="30" height="180" rx="2" fill="#2a3a5a"/>
  </g>
  <!-- Clothing rack (center) -->
  <rect x="1060" y="250" width="3" height="400" fill="url(#rack)"/>
  <rect x="1300" y="250" width="3" height="400" fill="url(#rack)"/>
  <rect x="1058" y="248" width="248" height="4" rx="2" fill="url(#rack)"/>
  <!-- Floor -->
  <rect x="0" y="800" width="1920" height="280" fill="#c4b498"/>
  <!-- Floor reflection -->
  <rect x="0" y="800" width="1920" height="40" fill="#d8c8a8" opacity="0.4"/>
  <!-- Display table -->
  <rect x="600" y="750" width="700" height="50" rx="4" fill="#b8a888"/>
  <rect x="620" y="700" width="100" height="50" rx="3" fill="#d8785a"/>
  <rect x="760" y="710" width="80" height="40" rx="3" fill="#5a78d8"/>
  <rect x="880" y="695" width="120" height="55" rx="3" fill="#78d85a"/>
  <rect x="1040" y="705" width="90" height="45" rx="3" fill="#d8b85a"/>
  <!-- Warm light spots -->
  <circle cx="340" cy="140" r="60" fill="#fff8e0" opacity="0.3"/>
  <circle cx="780" cy="140" r="60" fill="#fff8e0" opacity="0.3"/>
  <circle cx="1220" cy="140" r="60" fill="#fff8e0" opacity="0.3"/>
  <circle cx="1620" cy="140" r="60" fill="#fff8e0" opacity="0.3"/>
  <!-- Brand label -->
  <rect x="750" y="120" width="420" height="45" rx="3" fill="#292a26"/>
  <text x="960" y="150" font-family="Georgia,serif" font-size="20" fill="#fff8e1" text-anchor="middle" letter-spacing="8">FASHION</text>
</svg>
