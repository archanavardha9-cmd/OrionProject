<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a18"/>
      <stop offset="100%" stop-color="#1a1028"/>
    </linearGradient>
    <radialGradient id="screen-glow" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#4060a0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a1028" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#screen-glow)"/>
  <!-- Cinema screen -->
  <rect x="300" y="100" width="1320" height="500" rx="8" fill="#0f0f25"/>
  <rect x="310" y="110" width="1300" height="480" rx="4" fill="#1a1a35" opacity="0.8"/>
  <!-- Screen content suggestion -->
  <rect x="320" y="120" width="1280" height="460" rx="3" fill="#151530"/>
  <g opacity="0.15">
    <circle cx="960" cy="350" r="150" fill="#4060a0"/>
    <circle cx="800" cy="300" r="80" fill="#6040a0"/>
    <circle cx="1120" cy="380" r="100" fill="#40a060"/>
  </g>
  <!-- Screen border glow -->
  <rect x="298" y="98" width="1324" height="504" rx="10" fill="none" stroke="#4060a0" stroke-width="2" opacity="0.4"/>
  <!-- Seating rows -->
  <g fill="#1a1028">
    <rect x="200" y="700" width="1520" height="50" rx="6"/>
    <rect x="150" y="770" width="1620" height="55" rx="6"/>
    <rect x="100" y="845" width="1720" height="60" rx="6"/>
    <rect x="50" y="925" width="1820" height="65" rx="6"/>
  </g>
  <!-- Seat backs -->
  <g fill="#2a1a38" opacity="0.8">
    <rect x="230" y="680" width="50" height="30" rx="3"/>
    <rect x="300" y="680" width="50" height="30" rx="3"/>
    <rect x="370" y="680" width="50" height="30" rx="3"/>
    <rect x="440" y="680" width="50" height="30" rx="3"/>
    <rect x="510" y="680" width="50" height="30" rx="3"/>
    <rect x="680" y="680" width="50" height="30" rx="3"/>
    <rect x="750" y="680" width="50" height="30" rx="3"/>
    <rect x="820" y="680" width="50" height="30" rx="3"/>
    <rect x="890" y="680" width="50" height="30" rx="3"/>
    <rect x="960" y="680" width="50" height="30" rx="3"/>
    <rect x="1030" y="680" width="50" height="30" rx="3"/>
    <rect x="1200" y="680" width="50" height="30" rx="3"/>
    <rect x="1270" y="680" width="50" height="30" rx="3"/>
    <rect x="1340" y="680" width="50" height="30" rx="3"/>
    <rect x="1410" y="680" width="50" height="30" rx="3"/>
    <rect x="1480" y="680" width="50" height="30" rx="3"/>
    <rect x="1550" y="680" width="50" height="30" rx="3"/>
  </g>
  <!-- Aisle lights -->
  <g>
    <rect x="570" y="700" width="4" height="310" fill="#c8a96a" opacity="0.3"/>
    <rect x="1150" y="700" width="4" height="310" fill="#c8a96a" opacity="0.3"/>
  </g>
  <!-- Neon accents -->
  <rect x="300" y="620" width="1320" height="3" fill="url(#neon-accent)" opacity="0.5"/>
  <!-- Side ambient -->
  <rect x="40" y="200" width="3" height="500" fill="#ff6b6b" opacity="0.2"/>
  <rect x="1877" y="200" width="3" height="500" fill="#6b6bff" opacity="0.2"/>
  <!-- Ceiling fixtures -->
  <g fill="#2a2040">
    <rect x="400" y="50" width="80" height="20" rx="3"/>
    <rect x="700" y="50" width="80" height="20" rx="3"/>
    <rect x="1000" y="50" width="80" height="20" rx="3"/>
    <rect x="1300" y="50" width="80" height="20" rx="3"/>
  </g>
  <text x="960" y="660" font-family="Georgia,serif" font-size="16" fill="#8a7a9a" text-anchor="middle" letter-spacing="10" opacity="0.6">ENTERTAINMENT</text>
</svg>
