<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="atrium-ceiling" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f0e4"/>
      <stop offset="100%" stop-color="#e8dfc8"/>
    </linearGradient>
    <linearGradient id="floor-marble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e0cc"/>
      <stop offset="50%" stop-color="#d8ccb0"/>
      <stop offset="100%" stop-color="#c8b898"/>
    </linearGradient>
    <linearGradient id="wall-warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e8d4"/>
      <stop offset="100%" stop-color="#d8c8a8"/>
    </linearGradient>
    <radialGradient id="skylight" cx="50%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f0e0c0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e8d8b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="railing-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8975a"/>
      <stop offset="50%" stop-color="#d4b878"/>
      <stop offset="100%" stop-color="#b8975a"/>
    </linearGradient>
  </defs>
  <!-- Ceiling -->
  <rect width="1920" height="200" fill="url(#atrium-ceiling)"/>
  <!-- Skylight -->
  <rect x="560" y="0" width="800" height="180" rx="8" fill="url(#skylight)"/>
  <g stroke="#c8b898" stroke-width="2" opacity="0.4">
    <line x1="760" y1="0" x2="760" y2="180"/>
    <line x1="960" y1="0" x2="960" y2="180"/>
    <line x1="1160" y1="0" x2="1160" y2="180"/>
    <line x1="560" y1="60" x2="1360" y2="60"/>
    <line x1="560" y1="120" x2="1360" y2="120"/>
  </g>
  <!-- Left wall -->
  <polygon points="0,200 400,260 400,850 0,1080" fill="url(#wall-warm)"/>
  <!-- Right wall -->
  <polygon points="1920,200 1520,260 1520,850 1920,1080" fill="url(#wall-warm)"/>
  <!-- Floor (perspective) -->
  <polygon points="400,850 1520,850 1920,1080 0,1080" fill="url(#floor-marble)"/>
  <!-- Floor tile pattern -->
  <g stroke="#c0b090" stroke-width="0.5" opacity="0.3">
    <line x1="960" y1="850" x2="960" y2="1080"/>
    <line x1="680" y1="850" x2="480" y2="1080"/>
    <line x1="1240" y1="850" x2="1440" y2="1080"/>
    <line x1="400" y1="920" x2="1520" y2="920"/>
    <line x1="300" y1="1000" x2="1620" y2="1000"/>
  </g>
  <!-- Second floor balcony -->
  <rect x="400" y="260" width="1120" height="200" fill="#ede4d0"/>
  <!-- Second floor railing -->
  <rect x="400" y="450" width="1120" height="12" fill="url(#railing-gold)"/>
  <!-- Second floor storefronts -->
  <g>
    <rect x="420" y="280" width="220" height="160" rx="3" fill="#5a8a7c" opacity="0.6"/>
    <rect x="660" y="280" width="220" height="160" rx="3" fill="#8a6a5a" opacity="0.6"/>
    <rect x="900" y="280" width="220" height="160" rx="3" fill="#6a7a9a" opacity="0.6"/>
    <rect x="1140" y="280" width="220" height="160" rx="3" fill="#9a7a6a" opacity="0.6"/>
    <rect x="1380" y="280" width="120" height="160" rx="3" fill="#7a8a6a" opacity="0.6"/>
  </g>
  <!-- Ground floor -->
  <rect x="400" y="470" width="1120" height="380" fill="#e4dcc8"/>
  <!-- Ground floor storefronts -->
  <g>
    <rect x="420" y="490" width="250" height="330" rx="4" fill="#4a7a8c" opacity="0.5"/>
    <rect x="430" y="500" width="230" height="50" rx="2" fill="#292a26"/>
    <text x="545" y="532" font-family="Georgia,serif" font-size="14" fill="#fff8e1" text-anchor="middle" letter-spacing="3">FASHION</text>
    <rect x="690" y="490" width="250" height="330" rx="4" fill="#8a6a5a" opacity="0.5"/>
    <rect x="700" y="500" width="230" height="50" rx="2" fill="#292a26"/>
    <text x="815" y="532" font-family="Georgia,serif" font-size="14" fill="#fff8e1" text-anchor="middle" letter-spacing="3">LIFESTYLE</text>
    <rect x="960" y="490" width="250" height="330" rx="4" fill="#5a8a7c" opacity="0.5"/>
    <rect x="970" y="500" width="230" height="50" rx="2" fill="#292a26"/>
    <text x="1085" y="532" font-family="Georgia,serif" font-size="14" fill="#fff8e1" text-anchor="middle" letter-spacing="3">BEAUTY</text>
    <rect x="1230" y="490" width="250" height="330" rx="4" fill="#7a6a9a" opacity="0.5"/>
    <rect x="1240" y="500" width="230" height="50" rx="2" fill="#292a26"/>
    <text x="1355" y="532" font-family="Georgia,serif" font-size="14" fill="#fff8e1" text-anchor="middle" letter-spacing="3">JEWELLERY</text>
  </g>
  <!-- Columns -->
  <g fill="#d4c8a8">
    <rect x="390" y="200" width="20" height="650" rx="4"/>
    <rect x="1510" y="200" width="20" height="650" rx="4"/>
  </g>
  <!-- Column capitals -->
  <g fill="url(#railing-gold)">
    <rect x="385" y="196" width="30" height="12" rx="2"/>
    <rect x="1505" y="196" width="30" height="12" rx="2"/>
  </g>
  <!-- Escalator area (center) -->
  <g transform="translate(880,660)">
    <rect x="0" y="0" width="160" height="200" rx="3" fill="#a8a090" opacity="0.7"/>
    <line x1="20" y1="10" x2="140" y2="190" stroke="#c8b898" stroke-width="3" opacity="0.5"/>
    <line x1="30" y1="10" x2="150" y2="190" stroke="#c8b898" stroke-width="3" opacity="0.5"/>
    <!-- Escalator rails -->
    <line x1="15" y1="5" x2="15" y2="200" stroke="#d4b878" stroke-width="2"/>
    <line x1="145" y1="5" x2="145" y2="200" stroke="#d4b878" stroke-width="2"/>
  </g>
  <!-- Ambient lighting dots -->
  <g fill="#fff8e1" opacity="0.4">
    <circle cx="530" cy="240" r="4"/>
    <circle cx="770" cy="240" r="4"/>
    <circle cx="1010" cy="240" r="4"/>
    <circle cx="1250" cy="240" r="4"/>
    <circle cx="1400" cy="240" r="4"/>
  </g>
  <!-- Warm lighting overlay -->
  <rect width="1920" height="1080" fill="url(#skylight)" opacity="0.15"/>
</svg>
