<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="60%" stop-color="#b8dff0"/>
      <stop offset="100%" stop-color="#e8f4f8"/>
    </linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0d4b8"/>
      <stop offset="100%" stop-color="#c8b898"/>
    </linearGradient>
    <linearGradient id="canopy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a8a8a"/>
      <stop offset="100%" stop-color="#6a6a6a"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- Clouds -->
  <g fill="#fff" opacity="0.7">
    <ellipse cx="300" cy="150" rx="120" ry="50"/>
    <ellipse cx="380" cy="140" rx="80" ry="40"/>
    <ellipse cx="1400" cy="120" rx="140" ry="55"/>
    <ellipse cx="1500" cy="110" rx="90" ry="40"/>
    <ellipse cx="900" cy="80" rx="100" ry="35"/>
  </g>
  <!-- Ground / driveway -->
  <rect x="0" y="680" width="1920" height="400" fill="#b8a888"/>
  <!-- Parking lot -->
  <rect x="0" y="750" width="500" height="330" fill="#8a8a7a" opacity="0.5"/>
  <g stroke="#a0a090" stroke-width="1" opacity="0.3">
    <line x1="100" y1="750" x2="100" y2="1080"/>
    <line x1="200" y1="750" x2="200" y2="1080"/>
    <line x1="300" y1="750" x2="300" y2="1080"/>
    <line x1="400" y1="750" x2="400" y2="1080"/>
  </g>
  <!-- Car silhouettes -->
  <g fill="#5a5a50" opacity="0.4">
    <rect x="110" y="800" width="80" height="35" rx="8"/>
    <rect x="210" y="810" width="80" height="35" rx="8"/>
    <rect x="310" y="795" width="80" height="35" rx="8"/>
  </g>
  <!-- Main building -->
  <rect x="400" y="250" width="1200" height="430" rx="4" fill="url(#building)"/>
  <!-- Glass facade -->
  <rect x="420" y="270" width="1160" height="380" rx="2" fill="#6aa0b0" opacity="0.5"/>
  <!-- Window grid -->
  <g opacity="0.3" stroke="#fff" stroke-width="1">
    <line x1="600" y1="270" x2="600" y2="650"/>
    <line x1="780" y1="270" x2="780" y2="650"/>
    <line x1="960" y1="270" x2="960" y2="650"/>
    <line x1="1140" y1="270" x2="1140" y2="650"/>
    <line x1="1320" y1="270" x2="1320" y2="650"/>
    <line x1="420" y1="400" x2="1580" y2="400"/>
    <line x1="420" y1="530" x2="1580" y2="530"/>
  </g>
  <!-- Portico / covered driveway -->
  <rect x="650" y="600" width="620" height="80" rx="3" fill="url(#canopy)"/>
  <rect x="660" y="680" width="600" height="8" fill="#c8a96a"/>
  <!-- Support pillars -->
  <rect x="670" y="620" width="16" height="70" fill="#d4c4a0"/>
  <rect x="810" y="620" width="16" height="70" fill="#d4c4a0"/>
  <rect x="1090" y="620" width="16" height="70" fill="#d4c4a0"/>
  <rect x="1234" y="620" width="16" height="70" fill="#d4c4a0"/>
  <!-- Entrance doors -->
  <rect x="880" y="560" width="80" height="120" rx="2" fill="#4a7a8c" opacity="0.7"/>
  <rect x="970" y="560" width="80" height="120" rx="2" fill="#4a7a8c" opacity="0.7"/>
  <!-- Signage -->
  <rect x="800" y="260" width="320" height="40" rx="3" fill="#292a26"/>
  <text x="960" y="287" font-family="Georgia,serif" font-size="20" fill="#fff8e1" text-anchor="middle" letter-spacing="6">ORION MALL</text>
  <text x="960" y="320" font-family="sans-serif" font-size="10" fill="#8a8070" text-anchor="middle" letter-spacing="4">GORAKHPUR</text>
  <!-- Roof accent -->
  <rect x="400" y="246" width="1200" height="6" rx="2" fill="#c8a96a"/>
  <!-- Landscaping -->
  <g>
    <ellipse cx="450" cy="660" rx="40" ry="55" fill="#3d6b48"/>
    <ellipse cx="450" cy="650" rx="32" ry="42" fill="#4a7a53"/>
    <rect x="445" y="660" width="10" height="30" fill="#5a4a35"/>
    <ellipse cx="1480" cy="660" rx="40" ry="55" fill="#3d6b48"/>
    <ellipse cx="1480" cy="650" rx="32" ry="42" fill="#4a7a53"/>
    <rect x="1475" y="660" width="10" height="30" fill="#5a4a35"/>
  </g>
  <!-- Flower beds -->
  <g opacity="0.5">
    <ellipse cx="520" cy="690" rx="30" ry="10" fill="#4a7a53"/>
    <ellipse cx="1410" cy="690" rx="30" ry="10" fill="#4a7a53"/>
  </g>
  <!-- Driveway markings -->
  <rect x="700" y="720" width="520" height="3" fill="#c8b898" opacity="0.4"/>
  <!-- Side wing -->
  <rect x="1600" y="350" width="200" height="330" rx="3" fill="#d0c4a8"/>
  <rect x="180" y="350" width="220" height="330" rx="3" fill="#d0c4a8"/>
  <!-- Welcome text -->
  <text x="960" y="760" font-family="sans-serif" font-size="11" fill="#6a6050" text-anchor="middle" letter-spacing="5" opacity="0.5">WELCOME TO ORION MALL</text>
</svg>
